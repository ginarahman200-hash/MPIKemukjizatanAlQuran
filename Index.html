<body class="min-h-screen relative">

        <!-- HEADER -->

            <div class="space-y-4">

                    <input type="text" id="studentName" class="w-full p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-400 focus:outline-none" placeholder="Masukkan nama...">

                <span class="text-sm text-slate-500" id="studentInfoDisplay"></span>

            <h4 id="questionText" class="text-lg md:text-xl font-medium text-slate-800 mb-6 leading-relaxed">Pertanyaan akan muncul di sini?</h4>
            
            <div id="optionsContainer" class="space-y-3">
                <!-- Options injected by JS -->
            </div>
        </div>

        <!-- SECTION 4: RESULTS -->
        <div id="section-result" class="hidden-section glass p-6 md:p-8 rounded-2xl shadow-sm text-center">

                <i class="fas fa-check"></i>
            </div>
            <h3 class="text-2xl font-bold text-slate-800 mb-2">Kuis Selesai!</h3>
            <p class="text-slate-600 mb-6" id="resultMessage">Menyimpan hasil Anda...</p>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                    <span class="block text-3xl font-bold text-emerald-600" id="scoreBenar">0</span>
                    <span class="text-sm text-slate-500">Jawaban Benar</span>
                </div>
                <div class="bg-red-50 p-4 rounded-xl border border-red-100">
                    <span class="block text-3xl font-bold text-red-500" id="scoreSalah">0</span>
                    <span class="text-sm text-slate-500">Jawaban Salah</span>
                </div>
            </div>

            </div>

            <button onclick="resetApp()" class="w-full p-3 rounded-xl bg-slate-800 text-white font-semibold hover:bg-slate-900 shadow-md transition">Kembali ke Beranda</button>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // ==========================================
        // 1. DEKLARASI URL GOOGLE APPS SCRIPT
        // ==========================================
        // Ganti URL di bawah ini dengan URL Web App Anda setelah di-deploy
        const GAS_URL = "URL_GAS_ANDA_DISINI"; 
        
        // ==========================================
        // DATA SOAL
        // ==========================================
        const quizData = [
            {
                id: 1,
                question: "Aspek kemukjizatan Al-Quran yang berkaitan dengan keindahan susunan kata, gaya bahasa, dan kedalaman maknanya disebut...",
                options: ["I'jaz Ilmi (Ilmu Pengetahuan)", "I'jaz Lughawi (Bahasa)", "I'jaz Tasyri'i (Syariat)", "I'jaz Ghaibi (Berita Gaib)"],
                correct: "I'jaz Lughawi (Bahasa)"
            },
            {
                id: 2,
                question: "Al-Quran memberikan isyarat tentang teori penciptaan alam semesta yang di kemudian hari dibenarkan oleh sains modern (seperti Big Bang). Ini merupakan bukti dari...",
                options: ["Kemukjizatan Bahasa", "Kemukjizatan Hukum", "Kemukjizatan Ilmiah", "Kemukjizatan Sejarah"],
                correct: "Kemukjizatan Ilmiah"
            },
            {
                id: 3,
                question: "Surah yang menantang bangsa Arab (dan manusia seluruhnya) untuk membuat semisal Al-Quran walaupun hanya satu surah adalah...",
                options: ["Al-Baqarah", "Yasin", "Al-Kahfi", "Al-Mulk"],
                correct: "Al-Baqarah"
            }
        ];

        // ==========================================
        // STATE MANAGEMENT
        // ==========================================
        let currentStudent = { name: "", class: "" };
        let currentQuestionIndex = 0;
        let score = { benar: 0, salah: 0 };
        let studentAnswersDetail = []; 

        // ==========================================
        // UI FUNCTIONS
        // ==========================================
        function showSection(sectionId) {
            document.querySelectorAll('.glass').forEach(el => {
                if(el.id && el.id.startsWith('section-')) el.classList.add('hidden-section');
            });
            const target = document.getElementById(sectionId);
            if(target) target.classList.remove('hidden-section');
        }

        function startQuiz() {
            const nameInput = document.getElementById('studentName').value.trim();
            const classInput = document.getElementById('studentClass').value;
            
            if(!nameInput || !classInput) {
                alert("Mohon lengkapi Nama dan Kelas terlebih dahulu.");
                return;
            }

            currentStudent = { name: nameInput, class: classInput };
            document.getElementById('studentInfoDisplay').innerText = `${nameInput} (${classInput})`;
            
            currentQuestionIndex = 0;
            score = { benar: 0, salah: 0 };
            studentAnswersDetail = [];
            
            loadQuestion();
            showSection('section-quiz');
        }

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            document.getElementById('quizProgress').innerText = `Soal ${currentQuestionIndex + 1} / ${quizData.length}`;
            document.getElementById('questionText').innerText = q.question;
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = "";
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-emerald-400 hover:bg-emerald-50 transition-all font-medium text-slate-700 bg-white";
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(opt, q.correct, q.question);
                container.appendChild(btn);
            });
        }

        function handleAnswer(selected, correct, questionText) {
            const isCorrect = (selected === correct);
            if(isCorrect) score.benar++;
            else score.salah++;

            studentAnswersDetail.push({
                soal: questionText,
                jawaban_siswa: selected,
                kunci_jawaban: correct,
                status: isCorrect ? "BENAR" : "SALAH"
            });

            currentQuestionIndex++;
            if(currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            document.getElementById('scoreBenar').innerText = score.benar;
            document.getElementById('scoreSalah').innerText = score.salah;
            showSection('section-result');
            sendDataToGAS();
        }

        function resetApp() {
            document.getElementById('studentName').value = "";
            document.getElementById('studentClass').value = "";
            showSection('section-menu');
        }

        // ==========================================
        // BACKEND INTEGRATION (SEND TO GOOGLE SHEETS)
        // ==========================================
        async function sendDataToGAS() {
            const statusDiv = document.getElementById('syncStatus');
            
            if(GAS_URL === "https://script.google.com/macros/s/AKfycbxRw2s5bbpjiobxVP8EW4z49s6lUd-1-kk8d5TGb4ojnsCDdpIHi0N8lv7TmgCJpPcU7Q/exec") {
                statusDiv.className = "p-3 mb-6 rounded-lg text-sm flex items-center justify-center gap-2 bg-amber-100 text-amber-700";
                statusDiv.innerHTML = "<i class='fas fa-exclamation-triangle'></i> URL GAS belum disetting. Data tidak disimpan.";
                return;
            }

            const payload = {
                nama: currentStudent.name,
                kelas: currentStudent.class,
                benar: score.benar,
                salah: score.salah,
                detail: studentAnswersDetail
            };

            try {
                // Menggunakan fetch dengan Content-Type text/plain untuk menghindari CORS Preflight
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if(result.status === "success") {
                    statusDiv.className = "p-3 mb-6 rounded-lg text-sm flex items-center justify-center gap-2 bg-emerald-100 text-emerald-700";
                    statusDiv.innerHTML = "<i class='fas fa-check-circle'></i> Data berhasil disinkronkan ke Database!";
                } else {
                    throw new Error("Gagal dari server");
                }
            } catch (error) {
                console.error("Error saving data:", error);
                statusDiv.className = "p-3 mb-6 rounded-lg text-sm flex items-center justify-center gap-2 bg-red-100 text-red-700";
                statusDiv.innerHTML = "<i class='fas fa-times-circle'></i> Gagal menyinkronkan data. Periksa koneksi internet.";
            }
        }
    </script>
</body>
</html>
